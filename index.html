<!doctype html>
<html lang="pl">
<head>
  
  
  <title>Szlak Popiołów v2</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111714;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #app {
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      outline: none;
    }

    .ui {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.45);
      color: #e7e0cf;
      border: 1px solid rgba(231, 224, 207, 0.2);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      z-index: 20;
      user-select: none;
      min-width: 220px;
    }

    .mobile-controls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
    }

    .joystick-zone {
      position: absolute;
      left: 16px;
      bottom: 16px;
      width: 180px;
      height: 180px;
      pointer-events: auto;
      touch-action: none;
    }

    .joystick-base {
      position: absolute;
      left: 20px;
      bottom: 20px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.35);
      border: 1px solid rgba(255, 240, 220, 0.18);
      backdrop-filter: blur(4px);
    }

    .joystick-knob {
      position: absolute;
      left: 50px;
      top: 50px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(180, 140, 110, 0.75);
      border: 1px solid rgba(255, 230, 200, 0.35);
    }

    .mobile-right {
      position: absolute;
      right: 16px;
      bottom: 24px;
      width: 140px;
      height: 140px;
      pointer-events: none;
    }

    .mobile-btn {
      position: absolute;
      width: 76px;
      height: 76px;
      border: 1px solid rgba(255, 240, 220, 0.25);
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.45);
      color: #f0e6d2;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      backdrop-filter: blur(4px);
    }

    .mobile-btn:active,
    .mobile-btn.active {
      background: rgba(120, 60, 40, 0.55);
      border-color: rgba(255, 220, 180, 0.45);
    }

    .btn-attack {
      right: 0;
      bottom: 0;
    }

    @media (hover: hover) and (pointer: fine) {
      .mobile-controls {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.179.1/build/three.module.js'

    const app = document.querySelector('#app')

    const graphicsSettings = {
      qualityLabel: 'najwyższa',
      visualStyleLabel: 'realistyczna',
    }

    const scene = new THREE.Scene()
    scene.background = new THREE.Color(0x111714)
    scene.fog = new THREE.Fog(0x111714, 20, 85)

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.1,
      250
    )
    camera.position.set(0, 6, 10)

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
    })
    renderer.setSize(window.innerWidth, window.innerHeight)
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
    renderer.shadowMap.enabled = true
    renderer.shadowMap.type = THREE.PCFShadowMap
    renderer.outputColorSpace = THREE.SRGBColorSpace
    renderer.toneMapping = THREE.ACESFilmicToneMapping
    renderer.toneMappingExposure = 1.05
    app.appendChild(renderer.domElement)

    const ambientLight = new THREE.AmbientLight(0xb6a58d, 0.5)
    scene.add(ambientLight)

    const hemiLight = new THREE.HemisphereLight(0x8090b5, 0x1f1812, 0.42)
    scene.add(hemiLight)

    const moonLight = new THREE.DirectionalLight(0xd7def7, 1.8)
    moonLight.position.set(12, 18, 10)
    moonLight.castShadow = true
    moonLight.shadow.mapSize.width = 2048
    moonLight.shadow.mapSize.height = 2048
    moonLight.shadow.camera.near = 0.5
    moonLight.shadow.camera.far = 100
    moonLight.shadow.camera.left = -35
    moonLight.shadow.camera.right = 35
    moonLight.shadow.camera.top = 35
    moonLight.shadow.camera.bottom = -35
    scene.add(moonLight)

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(180, 180),
      new THREE.MeshStandardMaterial({
        color: 0x1d241f,
        roughness: 0.96,
        metalness: 0.03,
      })
    )
    ground.rotation.x = -Math.PI / 2
    ground.receiveShadow = true
    scene.add(ground)

    function addWorldProps() {
      for (let i = 0; i < 28; i++) {
        const stone = new THREE.Mesh(
          new THREE.BoxGeometry(
            0.8 + Math.random() * 1.8,
            0.6 + Math.random() * 1.8,
            0.8 + Math.random() * 1.8
          ),
          new THREE.MeshStandardMaterial({
            color: 0x4b4743,
            roughness: 0.96,
            metalness: 0.02,
          })
        )
        stone.position.set(
          (Math.random() - 0.5) * 70,
          0.4,
          (Math.random() - 0.5) * 70
        )
        stone.rotation.y = Math.random() * Math.PI
        stone.castShadow = true
        stone.receiveShadow = true
        scene.add(stone)
      }

      for (let i = 0; i < 12; i++) {
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.18, 0.24, 2.4, 8),
          new THREE.MeshStandardMaterial({
            color: 0x4a3327,
            roughness: 0.95,
            metalness: 0.01,
          })
        )
        trunk.position.set(
          (Math.random() - 0.5) * 60,
          1.2,
          (Math.random() - 0.5) * 60
        )
        trunk.castShadow = true
        trunk.receiveShadow = true

        const crown = new THREE.Mesh(
          new THREE.ConeGeometry(1.2, 2.6, 10),
          new THREE.MeshStandardMaterial({
            color: 0x2c3b2e,
            roughness: 0.95,
            metalness: 0.01,
          })
        )
        crown.position.set(trunk.position.x, 3.2, trunk.position.z)
        crown.castShadow = true
        crown.receiveShadow = true

        scene.add(trunk)
        scene.add(crown)
      }
    }

    addWorldProps()

    const player = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.45, 1.0, 4, 10),
      new THREE.MeshStandardMaterial({
        color: 0x8d7f6b,
        roughness: 0.84,
        metalness: 0.08,
      })
    )
    player.position.set(0, 1.0, 0)
    player.castShadow = true
    scene.add(player)

    const slash = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 1.0, 1.6),
      new THREE.MeshStandardMaterial({
        color: 0xffaa66,
        transparent: true,
        opacity: 0.0,
        roughness: 0.45,
        metalness: 0.0,
      })
    )
    slash.visible = false
    scene.add(slash)

    const input = {
      forward: false,
      backward: false,
      left: false,
      right: false,
      attack: false,
      attackPressed: false,
      lookActive: false,
      lookDeltaX: 0,
      lookDeltaY: 0,
      moveX: 0,
      moveY: 0,
    }

    const playerState = {
      hp: 100,
      maxHp: 100,
      speed: 5.2,
      attackDuration: 0.2,
      attackCooldown: 0.35,
      attackTimer: 0,
      cooldownTimer: 0,
      isAttacking: false,
      hitCooldown: 0,
    }

    const playerDirection = new THREE.Vector3(0, 0, 1)

    const cameraState = {
      yaw: 0,
      pitch: 0.45,
      distance: 8.5,
      heightOffset: 1.4,
      minPitch: 0.15,
      maxPitch: 1.15,
    }

    const enemies = []
    let wave = 1
    let respawnTimer = 0

    function createEnemy(x, z) {
      const group = new THREE.Group()

      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.42, 0.9, 4, 8),
        new THREE.MeshStandardMaterial({
          color: 0x6d1f1f,
          roughness: 0.82,
          metalness: 0.06,
        })
      )
      body.position.y = 1.0
      body.castShadow = true
      group.add(body)

      const hpBarBg = new THREE.Mesh(
        new THREE.PlaneGeometry(1.4, 0.16),
        new THREE.MeshBasicMaterial({ color: 0x220000 })
      )
      hpBarBg.position.set(0, 2.2, 0)
      group.add(hpBarBg)

      const hpBar = new THREE.Mesh(
        new THREE.PlaneGeometry(1.3, 0.1),
        new THREE.MeshBasicMaterial({ color: 0x55dd66 })
      )
      hpBar.position.set(0, 2.2, 0.01)
      group.add(hpBar)

      group.position.set(x, 0, z)
      scene.add(group)

      const state = {
        hp: 100,
        maxHp: 100,
        speed: 1.7 + Math.random() * 0.6,
        attackRange: 1.35,
        chaseRange: 18,
        attackCooldown: 1.0,
        attackTimer: Math.random() * 0.5,
        alive: true,
        hitFlash: 0,
      }

      const enemyObj = {
        group,
        body,
        hpBar,
        hpBarBg,
        state,
      }

      enemies.push(enemyObj)
    }

    function spawnWave(count) {
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + Math.random() * 0.5
        const radius = 8 + Math.random() * 8
        const x = Math.cos(angle) * radius
        const z = Math.sin(angle) * radius
        createEnemy(x, z)
      }
    }

    spawnWave(4)

    function setKeyValue(key, value) {
      if (key === 'w') input.forward = value
      if (key === 's') input.backward = value
      if (key === 'a') input.left = value
      if (key === 'd') input.right = value
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase()

      if (key === ' ') {
        if (!input.attack) input.attackPressed = true
        input.attack = true
        return
      }

      setKeyValue(key, true)
    })

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase()

      if (key === ' ') {
        input.attack = false
        return
      }

      setKeyValue(key, false)
    })

    let mouseLookActive = false
    let lastMouseX = 0
    let lastMouseY = 0

    renderer.domElement.addEventListener('mousedown', (e) => {
      if (e.button === 2) {
        mouseLookActive = true
        lastMouseX = e.clientX
        lastMouseY = e.clientY
      } else if (e.button === 0) {
        if (!input.attack) input.attackPressed = true
      }
    })

    window.addEventListener('mouseup', () => {
      mouseLookActive = false
    })

    window.addEventListener('mousemove', (e) => {
      if (!mouseLookActive) return
      const dx = e.clientX - lastMouseX
      const dy = e.clientY - lastMouseY
      lastMouseX = e.clientX
      lastMouseY = e.clientY
      cameraState.yaw -= dx * 0.005
      cameraState.pitch -= dy * 0.004
      cameraState.pitch = Math.max(cameraState.minPitch, Math.min(cameraState.maxPitch, cameraState.pitch))
    })

    window.addEventListener('contextmenu', (e) => {
      e.preventDefault()
    })

    function createMobileControls() {
      const root = document.createElement('div')
      root.className = 'mobile-controls'
      root.innerHTML = `
        <div class="joystick-zone">
          <div class="joystick-base">
            <div class="joystick-knob"></div>
          </div>
        </div>
        <div class="mobile-right">
          <div class="mobile-btn btn-attack">ATAK</div>
        </div>
      `
      document.body.appendChild(root)

      const zone = root.querySelector('.joystick-zone')
      const base = root.querySelector('.joystick-base')
      const knob = root.querySelector('.joystick-knob')
      const attackBtn = root.querySelector('.btn-attack')

      let joyActive = false
      let joyPointerId = null
      const center = { x: 90, y: 90 }
      const radius = 50

      function resetJoystick() {
        input.moveX = 0
        input.moveY = 0
        knob.style.transform = `translate(0px, 0px)`
      }

      function updateJoystick(clientX, clientY) {
        const rect = base.getBoundingClientRect()
        const cx = rect.left + rect.width / 2
        const cy = rect.top + rect.height / 2

        let dx = clientX - cx
        let dy = clientY - cy
        const len = Math.hypot(dx, dy)

        if (len > radius) {
          dx = (dx / len) * radius
          dy = (dy / len) * radius
        }

        input.moveX = dx / radius
        input.moveY = dy / radius
        knob.style.transform = `translate(${dx}px, ${dy}px)`
      }

      zone.addEventListener('pointerdown', (e) => {
        e.preventDefault()
        joyActive = true
        joyPointerId = e.pointerId
        updateJoystick(e.clientX, e.clientY)
      })

      zone.addEventListener('pointermove', (e) => {
        if (!joyActive || e.pointerId !== joyPointerId) return
        e.preventDefault()
        updateJoystick(e.clientX, e.clientY)
      })

      zone.addEventListener('pointerup', (e) => {
        if (e.pointerId !== joyPointerId) return
        joyActive = false
        joyPointerId = null
        resetJoystick()
      })

      zone.addEventListener('pointercancel', () => {
        joyActive = false
        joyPointerId = null
        resetJoystick()
      })

      attackBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault()
        attackBtn.classList.add('active')
        if (!input.attack) input.attackPressed = true
        input.attack = true
      })

      attackBtn.addEventListener('pointerup', (e) => {
        e.preventDefault()
        attackBtn.classList.remove('active')
        input.attack = false
      })

      attackBtn.addEventListener('pointercancel', () => {
        attackBtn.classList.remove('active')
        input.attack = false
      })

      let touchLookId = null

      renderer.domElement.addEventListener('pointerdown', (e) => {
        const isMobileLike = window.matchMedia('(hover: none), (pointer: coarse)').matches
        if (!isMobileLike) return
        if (e.clientX
