<!doctype html>
<html lang="pl">
<head>
  
  
  <title>Test GitHub Pages</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    .box {
      padding: 24px;
      border: 1px solid #444;
      border-radius: 12px;
      background: #1b1b1b;
      max-width: 640px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }

    p {
      margin: 6px 0;
      color: #ddd;
    }

    .ok {
      color: #7CFF9E;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>GitHub Pages działa</h1>
    <p class="ok">Publikacja działa poprawnie.</p>
    <p>Jeśli widzisz ten ekran, to repo i Pages są ustawione dobrze.</p>
    <p>Następny krok: podmienimy ten plik na wersję gry.</p>
  </div>
</body>
</html>
